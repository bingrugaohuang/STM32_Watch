      - generic [ref=e41]: "# Keil MDK 工具链集成 ## 概述 此 skill 让 Claude Code 能够直接调用 Keil MDK 的命令行工具 `UV4.exe`，完成 ARM 嵌入式项目的**编译、下载、调试和编译信息分析**，无需依赖 EIDE 或 Keil IDE 图形界面。 适用芯片：STM32F1/F4/... 全系列（Cortex-M 架构），Keil MDK v5。 ## 前置条件 1. Keil MDK v5 已安装，许可证有效 2. 项目包含有效的 `.uvprojx` 工程文件 3. 所有源文件和包含路径已在 `.uvprojx` 中正确配置 ## 第一步：定位 UV4.exe 不同机器的 Keil 安装路径可能不同。通过以下方式查找： ```bash # Windows — 搜索常见路径 cmd.exe /c \"dir /s /b C:\\*UV4.exe 2>nul\" cmd.exe /c \"dir /s /b D:\\*UV4.exe 2>nul\" ``` 常见路径： - `C:\\Keil_v5\\UV4\\UV4.exe` - `D:\\keil\\UV4\\UV4.exe` - `C:\\Program Files\\Keil\\UV4\\UV4.exe` 找到后，记录路径供后续使用（假设为 `<KEIL_UV4>`）。 ## 第二步：关键命令行参数 ```bash # 编译（增量构建） <KEIL_UV4> -b <project>.uvprojx -j0 -o build_output.txt # 全量重编译 <KEIL_UV4> -b <project>.uvprojx -j0 -o build_output.txt -r # 下载固件到芯片 <KEIL_UV4> -f <project>.uvprojx -j0 # 启动调试会话 <KEIL_UV4> -d <project>.uvprojx ``` 参数说明： - `-b`：batch build（命令行编译模式） - `-r`：rebuild all（全量重编译，否则增量编译） - `-f`：flash download（下载固件） - `-d`：debug（启动调试会话） - `-j0`：无窗口模式，不依赖 Windows GUI - `-o <file>`：将编译输出重定向到文件（**关键**：Claude Code 无法看到终端历史，必须通过文件读取） ## 第三步：退出码含义 | 退出码 | 含义 | |--------|------| | 0 | 成功（无错误） | | 1 | 有警告，无错误 | | 2 | 有编译错误 | | 3 | 致命错误 | 退出码 0 或 1 均表示链接成功，`.axf` 和 `.hex` 已生成。 ## 第四步：配置 .vscode/tasks.json 在项目的 `.vscode/tasks.json` 中添加以下任务模板（将 `<KEIL_UV4>` 替换为实际路径）： ```json { \"version\": \"2.0.0\", \"tasks\": [ { \"label\": \"Keil: Build\", \"type\": \"shell\", \"command\": \"<KEIL_UV4>\", \"args\": [ \"-b\", \"<project>.uvprojx\", \"-j0\", \"-o\", \"${workspaceFolder}/build_output.txt\" ], \"group\": \"build\", \"options\": { \"cwd\": \"${workspaceFolder}\" }, \"problemMatcher\": [], \"presentation\": { \"reveal\": \"always\", \"panel\": \"shared\" } }, { \"label\": \"Keil: Rebuild\", \"type\": \"shell\", \"command\": \"<KEIL_UV4>\", \"args\": [ \"-b\", \"<project>.uvprojx\", \"-j0\", \"-o\", \"${workspaceFolder}/build_output.txt\", \"-r\" ], \"group\": \"build\", \"options\": { \"cwd\": \"${workspaceFolder}\" }, \"problemMatcher\": [], \"presentation\": { \"reveal\": \"always\", \"panel\": \"shared\" } }, { \"label\": \"Keil: Download\", \"type\": \"shell\", \"command\": \"<KEIL_UV4>\", \"args\": [\"-f\", \"<project>.uvprojx\", \"-j0\"], \"group\": \"build\", \"options\": { \"cwd\": \"${workspaceFolder}\" }, \"problemMatcher\": [], \"presentation\": { \"reveal\": \"always\", \"panel\": \"shared\" } }, { \"label\": \"Keil: Build & Download\", \"type\": \"shell\", \"dependsOn\": [\"Keil: Build\"], \"dependsOrder\": \"sequence\", \"group\": \"build\", \"options\": { \"cwd\": \"${workspaceFolder}\" }, \"problemMatcher\": [], \"presentation\": { \"reveal\": \"always\", \"panel\": \"shared\" } } ] } ``` ## 第五步：标准工作流 ### Claude Code 执行编译的标准流程： 1. **编译**：运行 `Keil: Build` 任务或直接用 Bash 执行 UV4 命令 2. **读取输出**：编译完成后，读取 `build_output.txt` 3. **分析错误**：解析输出中的错误行（格式：`文件路径(行号): error: #错误码: 描述`） 4. **修复代码**：根据错误信息修改源文件 5. **重新编译**：重复步骤 1-4 直到 0 错误 6. **下载**（可选）：编译成功后运行 `Keil: Download` ### 实际 Bash 命令示例： ```bash cd \"<项目目录>/MDK-ARM\" d:/keil/UV4/UV4.exe -b STM32_Watch_Rewrite.uvprojx -j0 -o build_output.txt # 检查退出码 # 读取 build_output.txt 分析结果 ``` ## 第六步：常见编译错误排查 ### 1. `cannot open source input file \"xxx.h\"` 原因：Keil 项目的 IncludePath 缺少对应目录。 解决：在 `.uvprojx` 文件的 `<Cads><VariousControls><IncludePath>` 中添加路径（分号分隔）。 ### 2. `Undefined symbol xxx` 原因：缺少源文件或库文件。 解决：在 `.uvprojx` 文件的 `<Groups>` 中添加对应的 `.c` 文件。 ### 3. UV4.exe 启动失败 - 检查路径是否存在 - 检查 Keil 许可证是否有效（在 Keil IDE 中查看） - 如路径含空格，需用引号包裹 ### 4. 与 EIDE 项目共存 - EIDE 的 `.eide/eide.yml` 管理 EIDE 构建 - Keil 的 `.uvprojx` 管理 Keil/UV4 构建 - 两者的源文件列表和包含路径需**分别维护** - 新增源文件时，两个配置文件都要更新 ## 第七步：调试配置 如果需要调试功能，需配合 `.vscode/launch.json` 使用 OpenOCD/ST-Link： ```json { \"version\": \"0.2.0\", \"configurations\": [ { \"name\": \"Cortex Debug (ST-Link/OpenOCD)\", \"cwd\": \"${workspaceFolder}\", \"executable\": \"${workspaceFolder}/build/<project>.axf\", \"request\": \"launch\", \"type\": \"cortex-debug\", \"runToEntryPoint\": \"main\", \"servertype\": \"openocd\", \"serverpath\": \"<openocd.exe路径>\", \"configFiles\": [\"interface/stlink.cfg\", \"target/stm32f1x.cfg\"], \"gdbPath\": \"<arm-none-eabi-gdb.exe路径>\", \"svdFile\": \"${workspaceFolder}/.vscode/<芯片>.svd\" } ] } ``` ## 第七步：下载固件到芯片 ### 方法 A：OpenOCD + ST-Link（推荐，有 verify） ```bash # 一步完成：擦除 → 烧录 → 校验 → 复位运行 openocd -s <scripts_dir> \\ -f interface/stlink.cfg \\ -c \"transport select hla_swd\" \\ -c \"adapter speed 4000\" \\ -f target/stm32f1x.cfg \\ -c \"init\" \\ -c \"reset halt\" \\ -c \"stm32f1x mass_erase 0\" \\ -c \"program <firmware>.hex verify\" \\ -c \"reset\" \\ -c \"exit\" ``` **实战示例**（STM32F103C8T6）： ```bash OPENOCD=\"C:/Users/lihua/.eide/tools/openocd_7a1adfbec_mingw32/bin/openocd.exe\" SCRIPTS=\"C:/Users/lihua/.eide/tools/openocd_7a1adfbec_mingw32/share/openocd/scripts\" HEX=\"d:/Desk/Watch/STM32HAL/STM32_Watch_Rewrite/MDK-ARM/STM32_Watch_Rewrite/STM32_Watch_Rewrite.hex\" \"$OPENOCD\" -s \"$SCRIPTS\" \\ -f interface/stlink.cfg \\ -c \"transport select hla_swd\" \\ -c \"adapter speed 4000\" \\ -f target/stm32f1x.cfg \\ -c \"init\" -c \"reset halt\" \\ -c \"stm32f1x mass_erase 0\" \\ -c \"program $HEX verify\" \\ -c \"reset\" -c \"exit\" ``` 关键注意事项： - `transport select hla_swd` **必不可少**，否则报 `session transport was not selected` - ST-Link 实际速度被限制在 1000kHz（硬件固件限制），设置 4000 也不会报错但会被自动降速 - `verify` 参数让 OpenOCD 在烧录后回读校验，确保写入正确 ### 方法 B：UV4.exe -f（Keil 原生，简单快速） ```bash cd <项目目录>/MDK-ARM <KEIL_UV4> -f <project>.uvprojx -j0 ``` **优点**：一行命令，自动找到对应的 flash algo。 **缺点**：无 verify 步骤，依赖 Keil 工程中的 flash 配置正确。 ## 第八步：GDB 命令行调试 ### 启动 OpenOCD GDB 服务器（后台运行） ```bash openocd -s <scripts_dir> \\ -f interface/stlink.cfg \\ -c \"transport select hla_swd\" \\ -c \"adapter speed 4000\" \\ -f target/stm32f1x.cfg \\ & ``` GDB 服务器监听在 `localhost:3333`。 ### GDB 连接并进行基本调试 ```bash # 非交互式 (batch) 调试操作 arm-none-eabi-gdb -batch \\ -ex \"target extended-remote localhost:3333\" \\ -ex \"monitor reset halt\" \\ -ex \"info reg pc sp lr\" \\ -ex \"x/8i \\$pc\" \\ -ex \"monitor reset run\" \\ -ex \"quit\" \\ <firmware>.axf ``` ### 常用 GDB 命令速查 | 命令 | 用途 | |------|------| | `monitor reset halt` | 复位并停在第一条指令 | | `monitor reset run` | 复位并全速运行 | | `info reg pc sp lr` | 查看关键寄存器 | | `x/8i $pc` | 反汇编当前地址 8 条指令 | | `b main` / `c` | 在 main 设断点后继续运行 | | `p variable` | 查看变量值 | | `bt` | 回溯调用栈 | | `load` | 通过 GDB 下载固件 | | `monitor reset init` | 复位并执行初始化脚本 | ### 实战示例 — 快速验证固件是否运行 ```bash GDB=\"C:/Users/lihua/.eide/tools/gcc_arm/bin/arm-none-eabi-gdb.exe\" AXF=\"d:/Desk/Watch/STM32HAL/STM32_Watch_Rewrite/MDK-ARM/STM32_Watch_Rewrite/STM32_Watch_Rewrite.axf\" \"$GDB\" -batch \\ -ex \"target extended-remote localhost:3333\" \\ -ex \"monitor reset halt\" \\ -ex \"info reg pc\" \\ -ex \"x/4i \\$pc\" \\ -ex \"monitor reset run\" \\ \"$AXF\" ``` **已知警告**（可安全忽略）： - `Loadable section \"RW_IRAM1\" outside of ELF segments` — Keil/ARMCC 生成的 .axf 格式与 GDB 预期有细微差异，不影响调试功能 ## 经验总结 1. **输出必须重定向到文件**：UV4.exe 的输出不会自动保存，`-o` 参数是关键 2. **Keil 和 EIDE 的路径配置是独立的**：确保两个系统都能找到所有头文件 3. **退出码 1 也是成功**：只有警告时退出码为 1，但编译和链接均已完成 4. **ARMCC (AC5)** 编译的警告 `#1-D: last line of file ends without a newline` 是纯风格问题，可安全忽略 5. **`-j0`** 参数在无桌面环境（SSH、CI）中必不可少，否则 UV4.exe 会尝试弹窗 6. **OpenOCD 烧录 > UV4.exe 下载**：OpenOCD 有 verify 保证写入正确，UV4.exe 没有 7. **`transport select hla_swd`** 是 OpenOCD + ST-Link 的必须配置，忘记会导致连接失败 8. **ST-Link 实际速度**：虽然设置 4000kHz，但固件实际限制在 1000kHz，属正常现象 9. **GDB 非交互模式**：使用 `-batch` 参数，适合 Claude Code 自动化调试检查 这个skill是claudecode写的，写得怎么样，如果没问题我就直接同意了"
