            - paragraph [ref=e69]: 我们被问到关于OLED显示中文的字库编码问题。用户担心使用UTF-8会被ARM Compiler 5报错，所以用GBK，但导致其他文件的中文注释乱码。问是否所有文件都得改为GBK。
            - paragraph [ref=e70]: 用户使用ARM Compiler 5（可能是Keil MDK-ARM），对于中文字符串的编码，如果是OLED显示需要中文字库，通常是将字符串的字节码（如GBK编码）和字库对应。因为OLED显示函数通常是接收一个字符串，然后根据字库查找并显示。字库可能是按GBK编码顺序排列的。如果在代码中直接用UTF-8编码的字符串，那么字符串的字节序列不是GBK，查找字库会失败。
            - paragraph [ref=e71]: 因此需要解决：源代码文件编码与字库编码的匹配问题。
            - paragraph [ref=e72]: 常见方案：
            - list [ref=e73]:
              - listitem [ref=e74]:
                - paragraph [ref=e75]: 将显示用的中文字符串单独存储，可以使用单独的GBK编码文件，或者用转义序列。
              - listitem [ref=e76]:
                - paragraph [ref=e77]: 全部源代码使用GBK编码，这样中文字符串和注释都可以是GBK。Keil默认支持ANSI/GBK编码。ARM Compiler 5对UTF-8的支持确实不好（特别是中文），可能会报warning或错误。
              - listitem [ref=e78]:
                - paragraph [ref=e79]: 使用ARM Compiler 6，它支持UTF-8源文件，但用户可能被ARM Compiler 5限制。
              - listitem [ref=e80]:
                - paragraph [ref=e81]: 将中文字符串用\x转义直接写成GBK字节序列，这样源文件可以是UTF-8/ASCII，但字符串就是一堆十六进制，可读性差。
              - listitem [ref=e82]:
                - paragraph [ref=e83]: 使用单独的字符串资源文件，如用GBK编码的C文件专门放字符串，用extern声明，其他文件正常UTF-8或ASCII。
            - paragraph [ref=e84]: 我们需要建议：保持其他文件UTF-8（方便注释、版本管理），只把包含中文字符串用于OLED显示的文件设置为GBK编码，或者用转义序列。并提供具体操作指导。
            - paragraph [ref=e85]: 用户关心“是不是所有文件都得修改为GBK”，答案是否定的。可以通过分离字符串资源来避免全局编码修改。我们将解释并推荐方法。
            - paragraph [ref=e86]: 回答应具体、可行，结合嵌入式开发环境和ARM Compiler 5特点。并提到ARM Compiler 6的优势（如果可能升级）。最后强调只改必要的文件。
